name: My First GitHub Actions Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  STUDENT_NAME: "John Ginty"
  COURSE_NAME: "GitHub Actions Assignment"

jobs:
  greeting:
    runs-on: ubuntu-latest

    steps:
      - name: Display a greeting
        run: |
          echo "Hello, $STUDENT_NAME!"
          echo "Welcome to $COURSE_NAME."

      - name: Show repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Started by: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Finish successfully
        run: echo "My first GitHub Actions workflow ran successfully!"